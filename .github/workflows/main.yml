name: Cypress Automation Tests

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  cypress-run:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cypress Run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
